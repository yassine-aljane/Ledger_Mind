<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Rounded squircle background in dark ink (#16241f) -->
  <rect width="32" height="32" rx="8" fill="#16241f"/>
  
  <!-- "L" in Emerald Teal (#1d9e75) -->
  <line x1="10" y1="8" x2="10" y2="24" stroke="#1d9e75" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="24" x2="16" y2="24" stroke="#1d9e75" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- "M" in Coral (#e07a5f) -->
  <path d="M16 24V14L20 19L24 14V24" stroke="#e07a5f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Glowing brain/connection nodes in warm off-white (#fafaf7) -->
  <circle cx="10" cy="8" r="2" fill="#1d9e75"/>
  <circle cx="16" cy="14" r="2" fill="#fafaf7"/>
  <circle cx="20" cy="19" r="1.5" fill="#fafaf7"/>
  <circle cx="24" cy="14" r="2" fill="#e07a5f"/>
</svg>
