# Registre des sources du corpus RAG (fiscalité française créateurs/influenceurs).
# autorite : 1 = loi/décret (Légifrance)  2 = doctrine officielle (BOFiP/URSSAF/impots)  3 = guide/privé
# Le script scripts/seed_corpus.py télécharge et ingère ces pages au premier lancement.

sources:
  - titre: "Loi n° 2023-451 du 9 juin 2023 (loi Influenceurs)"
