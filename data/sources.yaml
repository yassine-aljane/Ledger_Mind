# Sources accessibles dynamiquement via les serveurs MCP (pas besoin de les figer ici) :
#   - BOFiP (doctrine opposable) -> serveur mcp "bofip" (API Opendatasoft, dataset bofip-vigueur)
#       ex : POST /mcp/ingest-bofip?requete=avantages en nature influenceur
#   - CGI et Code de la consommation -> serveur mcp "legifrance", outil code_article
#       ex : code_article(code="CGI", article="155 B")
#   - Ordonnance du 6/11/2024 et décret du 28/11/2025 -> serveur mcp "legifrance", legifrance_search
#
